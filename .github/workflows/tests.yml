name: tests

# Minimal, additive CI: lint the new test suite with ruff, then run the
# fully-offline money-moving unit tests. No network at test time
# (yfinance/Anthropic/Robinhood are all mocked inside the tests).
#
# kelly.py / tax_harvester.py / sentiment_connector.py are now thin shims that
# re-export gesh_core, so the shared package MUST be installed or test collection
# fails on import. gesh-core is a separate PRIVATE repo, so a GESH_CORE_PAT repo
# secret (fine-grained PAT, read access to gesh75/gesh-core) is required.
#
# Trigger scope (2026-06-30, coverage-audit fix): previously a narrow `paths:` allowlist
# (kelly/consensus/fft_cycles/trading only) meant a change to server.py, billing.py, or any
# other app module ran ZERO tests — a payment-code or dashboard-code regression could merge
# with CI green. Switched to `paths-ignore` (denylist docs/config-only paths) so any code
# change triggers CI by default; only pure documentation/asset changes are skipped.
#
# android*/** is deliberately NOT in this list (2026-07-01, Codex round-2 fix): an earlier
# version ignored it, which silently exempted tracked Kotlin/Gradle SOURCE from ever
# triggering CI — contradicting "any code change triggers CI." Generated Android build
# artifacts (android*/**/build/, .gradle/) are already gitignored and never reach a diff, so
# there's nothing left to explicitly ignore; an Android-only change now runs this (Python)
# suite too — a harmless no-op run, not a gap — until a dedicated Android workflow exists.

on:
  push:
    branches: [main, "optimize/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "memory-bank/**"
      - "_archive/**"
      - "career-ops/**"
  # Intentionally UNFILTERED — do not add paths-ignore here. `test` and
  # `customer-isolation` are REQUIRED checks, and when an entire workflow is
  # skipped by path filtering GitHub never creates their check runs, so they sit
  # at "Expected — waiting for status to be reported" forever and a docs-only PR
  # can never go green. (That is the OPPOSITE of a job skipped by an `if:`
  # condition, which reports success — the asymmetry behind the incident noted
  # on the test job below.) Push keeps its filter above; nothing gates on push.
  pull_request:
  # Manual re-run of main CI without empty commits.
  workflow_dispatch:

jobs:
  # Fast, secret-free first signal on every PR: lints the test suite and proves
  # the whole repo still parses, without waiting on a dependency install.
  # The heavier `test` / `customer-isolation` gates also run on same-repo PRs —
  # see the note on the test job for why they must not be push-only.
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install ruff
      - name: Ruff (new test suite only)
        run: ruff check tests/
      - name: Syntax + undefined-name gate (whole repo)
        # --isolated is REQUIRED, not incidental: pyproject.toml sets
        # `include = ["tests/**/*.py"]`, so without it ruff silently scans
        # nothing outside tests/ and reports "All checks passed" — a green gate
        # that checks zero app files. --isolated ignores that config while still
        # applying ruff's built-in excludes (venv, build, node_modules, ...).
        run: ruff check --isolated --select E9,F63,F7,F82 .

  test:
    # Runs on pushes to main/optimize/**, and on pull requests raised FROM THIS
    # REPOSITORY. Fork PRs are excluded because the credential-scoped install
    # below needs GESH_CORE_PAT, which GitHub withholds from fork workflows
    # anyway (this repo is private with no forks, so that path is theoretical).
    #
    # 2026-08-02 — why this is no longer `push`-only: PR #132 narrowed both this
    # job and customer-isolation to `if: github.event_name == 'push'` to keep the
    # PAT away from PR-controlled dependency manifests. Both are REQUIRED checks,
    # and a job skipped by a CONDITIONAL reports its check as *successful* — so
    # the guard silently turned branch protection on main into a no-op: no pull
    # request ran either gate. PR #133 then merged a file with a SyntaxError
    # under fully green CI. The credential concern was real but is addressed
    # properly by the two-step install below (the PAT is never live while
    # repository-controlled code builds), rather than by disabling the gate.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Two-step install: the credential is live for exactly one package ──
      # The PAT is in scope ONLY while the single pinned gesh-core package is
      # fetched, and nothing repository-controlled builds during that step. Every
      # other dependency — where a PR-authored sdist's setup.py could execute
      # arbitrary code — installs in the next step with no credential present.
      # That ordering, not disabling the job, is what makes running on pull
      # requests safe.
      - name: Install private gesh-core (credential-scoped)
        env:
          GESH_CORE_PAT: ${{ secrets.GESH_CORE_PAT }}
        run: |
          set -euo pipefail
          # Step-scoped git config; the trap removes it even on failure.
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          if [ -z "${GESH_CORE_PAT:-}" ]; then
            echo "::error::GESH_CORE_PAT not set — the private gesh-core dependency cannot install."
            exit 1
          fi
          git config --global url."https://x-access-token:${GESH_CORE_PAT}@github.com/".insteadOf "https://github.com/"
          python -m pip install --upgrade pip
          # Pin the SOURCE, not just the SHA: a pull request must not be able to
          # redirect the credential-bearing install at another repository.
          CORE_SPEC="$(grep '^gesh-core @' requirements.lock)"
          case "$CORE_SPEC" in
            "gesh-core @ git+https://github.com/gesh75/gesh-core.git@"*) ;;
            *) echo "::error::unexpected gesh-core source: ${CORE_SPEC}"; exit 1 ;;
          esac
          pip install "$CORE_SPEC"

      - name: Install remaining runtime + test deps (no credential in scope)
        run: |
          set -euo pipefail
          # Install the RUNTIME FROM THE LOCK, not from requirements.txt. The
          # lock is the fully-resolved manifest, so the tree CI tests is exactly
          # the tree that was reviewed. gesh-core is already satisfied above and
          # is filtered out here so pip never re-fetches it (which would need the
          # credential we deliberately dropped).
          # (openbb stays out entirely: the uvicorn-incompatible meta-package
          # lives in requirements-openbb.txt and fundamentals_openbb.py guards
          # its import.)
          # No dependency cache is configured: every run installs freshly from
          # the lock, which is deterministic. If caching is added later, the key
          # must include the Python version and the requirements.lock hash.
          grep -v '^gesh-core @' requirements.lock > ci-rest.lock
          pip install -r ci-rest.lock
          # Fail fast on a broken dependency graph rather than at import time.
          pip check
          # Test + lint tooling, intentionally separate from the runtime lock:
          pip install pytest pytest-cov ruff

      - name: Ruff (new test suite only)
        run: ruff check tests/

      - name: Syntax + undefined-name gate (whole repo)
        # E9 = syntax/IO errors, F63/F7 = always-wrong constructs, F82 = undefined
        # names. Deliberately NOT a full lint — this repo is not ruff-clean — but
        # a file that cannot parse must never merge. PR #133's merge commit
        # shipped a SyntaxError in fetch_snapshot_direct.py under green CI
        # precisely because nothing checked anything outside tests/.
        run: ruff check --isolated --select E9,F63,F7,F82 .

      - name: Run offline money-logic unit tests
        run: |
          # Whole-repo coverage (config in pyproject.toml [tool.coverage.run]).
          # Floor matches [tool.coverage.report] fail_under=55 (raised from the
          # earlier soft 45 baseline once the suite cleared that bar).
          pytest tests/ -q --cov=. --cov-report=term-missing --cov-fail-under=55

  # Secret-free supply-chain + static security scan. Does not replace the leak
  # sweep; catches dependency CVEs and high-confidence Bandit findings early.
  security:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tooling
        run: pip install pip-audit bandit
      - name: pip-audit (lockfile, skip private git dep)
        run: |
          set -euo pipefail
          # gesh-core is a private git URL — pip-audit cannot fetch it without a
          # PAT. Audit everything else from the reviewed lock; core stays gated
          # by the credential-scoped install in the test job.
          grep -v '^gesh-core @' requirements.lock > ci-audit.lock
          # Soft-fail first wave: report CVEs without blocking merge until the
          # dependency triage backlog is cleared. Bandit (below) remains hard.
          pip-audit -r ci-audit.lock --progress-spinner off || {
            echo "::warning::pip-audit reported vulnerabilities — see log; not failing the gate yet"
            exit 0
          }
      - name: bandit (high severity / high confidence only)
        run: |
          # -lll = HIGH severity only; -iii = HIGH confidence only — avoids
          # failing the gate on noisy medium findings while the codebase is
          # retro-cleaned. Expand later.
          bandit -r . \
            --exclude ./tests,./venv,./.venv,./_archive,./android,./android\ 2,./android\ 3,./career-ops,./memory-bank \
            -lll -iii

  # Separate REQUIRED gate for customer data-isolation (Codex 4th-pass P1): the
  # leak sweep + XSS-wiring guard run in-process against a deterministic seeded
  # fixture (no live server, no network — fully offline), so a masking or template
  # regression fails its OWN check instead of hiding among the unit tests. Runs the
  # exact same files the unit job does; the value is an explicit, named gate that
  # branch protection can require on protected push workflows.
  customer-isolation:
    # Same trigger scope and same credential handling as the test job above —
    # see the long note there for why this is not `push`-only any more.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install private gesh-core (credential-scoped)
        env:
          GESH_CORE_PAT: ${{ secrets.GESH_CORE_PAT }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          if [ -z "${GESH_CORE_PAT:-}" ]; then
            echo "::error::GESH_CORE_PAT not set — the private gesh-core dependency cannot install."
            exit 1
          fi
          git config --global url."https://x-access-token:${GESH_CORE_PAT}@github.com/".insteadOf "https://github.com/"
          python -m pip install --upgrade pip
          CORE_SPEC="$(grep '^gesh-core @' requirements.lock)"
          case "$CORE_SPEC" in
            "gesh-core @ git+https://github.com/gesh75/gesh-core.git@"*) ;;
            *) echo "::error::unexpected gesh-core source: ${CORE_SPEC}"; exit 1 ;;
          esac
          pip install "$CORE_SPEC"
      - name: Install remaining runtime + test deps (no credential in scope)
        run: |
          set -euo pipefail
          # Runtime from the lock (see the test job) so both gates run against
          # the identical, reviewed dependency tree.
          grep -v '^gesh-core @' requirements.lock > ci-rest.lock
          pip install -r ci-rest.lock
          pip check
          pip install pytest ruff
      - name: Customer-isolation leak sweep + XSS wiring (deterministic, in-process)
        run: |
          pytest tests/test_customer_leak_sweep.py tests/test_dashboard_xss_wiring.py \
                 tests/test_customer_view.py -q
