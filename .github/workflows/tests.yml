name: tests

# Minimal, additive CI: lint the new test suite with ruff, then run the
# fully-offline money-moving unit tests. No network at test time
# (yfinance/Anthropic/Robinhood are all mocked inside the tests).
#
# kelly.py / tax_harvester.py / sentiment_connector.py are now thin shims that
# re-export gesh_core, so the shared package MUST be installed or test collection
# fails on import. gesh-core is a separate PRIVATE repo, so a GESH_CORE_PAT repo
# secret (fine-grained PAT, read access to gesh75/gesh-core) is required.
#
# Trigger scope (2026-06-30, coverage-audit fix): previously a narrow `paths:` allowlist
# (kelly/consensus/fft_cycles/trading only) meant a change to server.py, billing.py, or any
# other app module ran ZERO tests — a payment-code or dashboard-code regression could merge
# with CI green. Switched to `paths-ignore` (denylist docs/config-only paths) so any code
# change triggers CI by default; only pure documentation/asset changes are skipped.
#
# android*/** is deliberately NOT in this list (2026-07-01, Codex round-2 fix): an earlier
# version ignored it, which silently exempted tracked Kotlin/Gradle SOURCE from ever
# triggering CI — contradicting "any code change triggers CI." Generated Android build
# artifacts (android*/**/build/, .gradle/) are already gitignored and never reach a diff, so
# there's nothing left to explicitly ignore; an Android-only change now runs this (Python)
# suite too — a harmless no-op run, not a gap — until a dedicated Android workflow exists.

on:
  push:
    branches: [main, "optimize/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "memory-bank/**"
      - "_archive/**"
      - "career-ops/**"
  pull_request:

jobs:
  # A fast, secret-free syntax/lint gate for pull requests. Secret-bearing jobs
  # run only after reviewed code reaches a push event.
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install ruff
      - name: Ruff (new test suite only)
        run: ruff check tests/

  test:
    # This job installs a private dependency with GESH_CORE_PAT. Keep it off
    # pull_request events, whose checkout and dependency manifest are controlled
    # by the PR author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + test deps
        env:
          GESH_CORE_PAT: ${{ secrets.GESH_CORE_PAT }}
        run: |
          # Keep the credential in a step-scoped temporary config. The trap
          # removes it before any repository-controlled test code executes.
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          if [ -n "$GESH_CORE_PAT" ]; then
            git config --global url."https://x-access-token:${GESH_CORE_PAT}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::GESH_CORE_PAT not set — the private gesh-core dependency will fail to install."
          fi
          python -m pip install --upgrade pip
          # Install the RUNTIME FROM THE LOCK, not from requirements.txt. The
          # lock is the fully-resolved manifest, so the tree CI tests is exactly
          # the tree that was reviewed — including gesh-core at its pinned,
          # peeled commit SHA. Installing from a fully-resolved lock also keeps
          # the CI log unambiguous: it names one object, so there is nothing to
          # reconcile against an annotated tag's own object SHA.
          # (openbb stays out entirely: the uvicorn-incompatible meta-package
          # lives in requirements-openbb.txt and fundamentals_openbb.py guards
          # its import.)
          # No dependency cache is configured: every run installs freshly from
          # the lock, which is deterministic. If caching is added later, the key
          # must include the Python version and the requirements.lock hash.
          pip install -r requirements.lock
          # Fail fast on a broken dependency graph rather than at import time.
          pip check
          # Test + lint tooling, intentionally separate from the runtime lock:
          pip install pytest pytest-cov ruff

      - name: Ruff (new test suite only)
        run: ruff check tests/

      - name: Run offline money-logic unit tests
        run: |
          # Whole-repo coverage (config in pyproject.toml [tool.coverage.run]) so gaps in
          # untested app modules are VISIBLE in the CI log instead of hidden behind a
          # 4-module allowlist. No --cov-fail-under yet — this establishes the real
          # baseline first; a floor can be added once the number is known.
          pytest tests/ -q --cov=. --cov-report=term-missing --cov-fail-under=45

  # Separate REQUIRED gate for customer data-isolation (Codex 4th-pass P1): the
  # leak sweep + XSS-wiring guard run in-process against a deterministic seeded
  # fixture (no live server, no network — fully offline), so a masking or template
  # regression fails its OWN check instead of hiding among the unit tests. Runs the
  # exact same files the unit job does; the value is an explicit, named gate that
  # branch protection can require on protected push workflows.
  customer-isolation:
    # As above, never expose the private-repository credential to PR-controlled
    # installation inputs. The secret-free pr-lint job remains the PR gate.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + test deps
        env:
          GESH_CORE_PAT: ${{ secrets.GESH_CORE_PAT }}
        run: |
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          if [ -n "$GESH_CORE_PAT" ]; then
            git config --global url."https://x-access-token:${GESH_CORE_PAT}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::GESH_CORE_PAT not set — the private gesh-core dependency will fail to install."
          fi
          python -m pip install --upgrade pip
          # Runtime from the lock (see the test job) so both gates run against
          # the identical, reviewed dependency tree.
          pip install -r requirements.lock
          pip check
          pip install pytest ruff
      - name: Customer-isolation leak sweep + XSS wiring (deterministic, in-process)
        run: |
          pytest tests/test_customer_leak_sweep.py tests/test_dashboard_xss_wiring.py \
                 tests/test_customer_view.py -q
