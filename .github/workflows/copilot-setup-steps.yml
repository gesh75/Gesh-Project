# Environment preparation for the GitHub Copilot coding agent.
#
# The agent runs ONLY the job named `copilot-setup-steps` before it starts work,
# so dependencies are already installed when it opens a PR.
# https://docs.github.com/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
#
# Deliberately NO `pull_request` trigger: a fork PR editing this file would
# otherwise execute untrusted code on our runner.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Authorize private gesh-core dependency
        env:
          GESH_CORE_PAT: ${{ secrets.GESH_CORE_PAT }}
        run: |
          if [ -n "$GESH_CORE_PAT" ]; then
            git config --global url."https://x-access-token:${GESH_CORE_PAT}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::GESH_CORE_PAT not set - the private gesh-core dependency will fail to install."
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest pytest-cov ruff
