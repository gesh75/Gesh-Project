# Minimal config — pytest + ruff only. This repo is run as loose modules
# (not an installed package), so no [build-system] / packaging metadata is added.
# Additive on purpose: introduces test discovery + markers without touching app code.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, fully-offline unit tests (no network, no DB, no broker, no LLM)",
    "integration: tests that touch a real DB, filesystem, or external service",
]

[tool.ruff]
# Scope ruff to the new test suite only — do not retro-lint the owner's app code.
include = ["tests/**/*.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# E402: tests legitimately import after sys.path manipulation and stub modules.
# E501: line-length not enforced on tests (long asserts / stub lambdas aren't
#       worth wrapping) — matches the gesh-core / engine lint policy, which omits
#       the E5 group. Real-bug rules (F, imports, E7) stay on.
ignore = ["E402", "E501"]

[tool.coverage.run]
# Whole-repo coverage so app-code gaps (server.py, regime.py, monte_carlo.py, ...) are
# VISIBLE instead of invisible — CI previously only measured 4 of ~90 modules, which hid
# how little of the app is exercised. This reports the real baseline; it does not require
# every module to already have tests.
source = ["."]
omit = [
    "venv/*", "*/venv/*",
    "tests/*",
    "scripts/*",
    "_archive/*",
    "android*/*",
    "career-ops/*",
    "memory-bank/*",
    "templates/*",
    "*/__pycache__/*",
]
# security/ (e.g. api_verifier.py, which powers GET /api/security/health) is NOT omitted —
# it's real production code (2026-07-01, Codex round-2 fix). Omitting it hid an active
# endpoint's coverage gap behind a report that otherwise claims to be "whole-repo."

[tool.coverage.report]
skip_empty = true
fail_under = 55
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
# Target: raise to 70 then 80%+ as more pure logic (consensus/kelly/risk/engines)
# moves to or is covered via gesh-core. See GAPS_AND_IMPROVEMENTS_*.md
# Whole-repo view intentionally exposes gaps in server.py, agents, etc.
